name: ETL tests

on: [push, pull_request]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: etl_test
          POSTGRES_PASSWORD: local_ci_only
          POSTGRES_DB: trading_etl_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U etl_test -d trading_etl_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: etl_test
      PGPASSWORD: local_ci_only
      PGDATABASE: trading_etl_test
      TEST_DATABASE_DSN: "host=localhost port=5432 dbname=trading_etl_test user=etl_test password=local_ci_only"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Bootstrap disposable database
        run: |
          psql -v ON_ERROR_STOP=1 -f sql/create_schemas.sql
          psql -v ON_ERROR_STOP=1 -f sql/create_tables.sql
          psql -v ON_ERROR_STOP=1 -f sql/core_transformations.sql
          psql -v ON_ERROR_STOP=1 -f sql/trade_grouping.sql
      - name: Run tests
        run: python -m unittest discover -s tests -v
      - name: Check analysis SQL
        run: psql -v ON_ERROR_STOP=1 -f sql/analysis_queries.sql
